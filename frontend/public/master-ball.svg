<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Top half: purple -->
  <circle cx="50" cy="50" r="48" fill="#6a0dad"/>
  <path d="M2 50 A48 48 0 0 1 98 50" fill="#6a0dad"/>
  <!-- Bottom half: white -->
  <path d="M2 50 A48 48 0 0 0 98 50" fill="#fff"/>
  <!-- Center band -->
  <rect x="2" y="46" width="96" height="8" fill="#333" rx="2"/>
  <!-- Center button -->
  <circle cx="50" cy="50" r="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- M letter -->
  <text x="50" y="54" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial" fill="#6a0dad">M</text>
  <!-- Left bump -->
  <circle cx="50" cy="46" r="4" fill="#6a0dad"/>
  <!-- Right bump -->
  <circle cx="50" cy="54" r="4" fill="#fff"/>
</svg>
