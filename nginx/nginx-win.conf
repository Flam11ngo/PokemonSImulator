# PokemonSimulator Nginx - Windows
# 安装: 1) 下载 nginx Windows 版 → 2) 解压到 C:\nginx\ → 3) 复制此文件到 C:\nginx\conf\
worker_processes 1;
events { worker_connections 1024; }

http {
    include conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ============================================================
    # 缓存策略
    # ============================================================
    # 精灵图表 (sprite sheets) — 长期缓存，文件名不变
    map $uri $sprite_cache {
        "~*icons-sheet"  "public, max-age=2592000, immutable";  # 30天
        "~*items-sheet"  "public, max-age=2592000, immutable";
        default          "public, max-age=604800";              # 7天
    }

    server {
        listen 80;
        server_name localhost;

        # === 前端 SPA (不缓存 index.html) ===
        location = /index.html {
            root E:/PokemonSImulator/frontend/dist;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location / {
            root E:/PokemonSImulator/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # === API 反向代理 → standalone_server.py (9000) ===
        location /api/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # === WebSocket ===
        location /ws {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # === 精灵图 (sprite sheets) — 30天不可变缓存 ===
        location ~* /sprites/.*-sheet\.(png|jpg)$ {
            alias E:/PokemonSImulator/frontend/public/sprites/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # === 其他静态精灵图 — 7天缓存 ===
        location /sprites/ {
            alias E:/PokemonSImulator/frontend/public/sprites/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # === 前端 JS/CSS 构建产物 — 30天缓存 (带 hash) ===
        location /assets/ {
            root E:/PokemonSImulator/frontend/dist;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
