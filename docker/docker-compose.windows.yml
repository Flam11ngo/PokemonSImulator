# ============================================================
# PokemonSimulator Docker Compose — Windows (Docker Desktop)
# ============================================================
# 前置条件: Docker Desktop for Windows 已安装并运行
#
# 用法:
#   docker compose -f docker/docker-compose.windows.yml up -d
#   docker compose -f docker/docker-compose.windows.yml --profile frontend up -d
#
# 注意:
#   - Windows 上大数据组件 (Hadoop/Spark/Kafka) 通常太重
#   - 此配置仅包含: PostgreSQL + API Server + Nginx 前端
#   - 开发模式推荐直接跑 Python/Node, 不用 Docker
# ============================================================

version: '3.9'

services:
  # ============================================================
  # PostgreSQL (运营数据库)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: pokemon-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon123
      POSTGRES_DB: pokemon_simulator
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pokemon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon_simulator"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # API Server (FastAPI standalone WebSocket mode)
  # ============================================================
  api-server:
    build:
      context: ../api-server
      dockerfile: ../docker/api-server/Dockerfile.windows
    hostname: api-server
    container_name: pokemon-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Windows standalone mode: 不需要 Kafka/HDFS/Redis
      SIMULATOR_MODE: standalone
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon123
      POSTGRES_DB: pokemon_simulator
      DATABASE_URL: "postgresql://pokemon:pokemon123@postgres:5432/pokemon_simulator"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DEBUG: "false"
    volumes:
      - ../data:/app/data:ro
      - ./battle-engine/cache:/tmp/pokemon-engine
    networks:
      - pokemon-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # Nginx (Frontend + Reverse Proxy)
  # ============================================================
  nginx:
    image: nginx:alpine
    hostname: nginx
    container_name: pokemon-nginx
    profiles: ["frontend"]
    depends_on:
      - api-server
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pokemon-net
    restart: unless-stopped

# ============================================================
# Networks
# ============================================================
networks:
  pokemon-net:
    driver: bridge
    name: pokemon-net

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres-data:
